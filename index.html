<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mặc Gì Đây?</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f7f5f1;
            color: #171717;
            font-family: Arial, sans-serif;
        }

        .container {
            width: min(900px, calc(100% - 40px));
            margin: 80px auto;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 52px;
            margin-bottom: 10px;
        }

        .status {
            padding: 15px 18px;
            border-radius: 12px;
            margin: 25px 0;
            background: #eee;
        }

        .success {
            background: #dff7e7;
            color: #176b36;
        }

        .error {
            background: #ffe1e1;
            color: #9b2020;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .category {
            background: white;
            border: 1px solid #e5e1da;
            border-radius: 16px;
            padding: 30px 15px;
            text-align: center;
        }

        .category strong {
            display: block;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .category small {
            color: #888;
        }

        @media(max-width:700px) {
            .categories {
                grid-template-columns: repeat(2, 1fr);
            }

            h1 {
                font-size: 42px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Mặc Gì Đây?</h1>

    <p>
        Test kết nối GitHub Pages với Supabase.
    </p>

    <div
        id="status"
        class="status">

        ⏳ Đang kết nối Supabase...

    </div>

    <h2>Danh mục</h2>

    <div
        id="categories"
        class="categories">

    </div>

</div>


<script type="module">

/*
==================================================
SUPABASE CONFIG
==================================================
*/

const SUPABASE_URL =
    "https://rxeqynitxruylvcybrca.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_DCZRB5bpOCQUGwEWWevizg_lAp2YvIm";


/*
==================================================
LOAD SUPABASE JS
==================================================
*/

import {
    createClient
} from "https://esm.sh/@supabase/supabase-js@2";


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/*
==================================================
ELEMENTS
==================================================
*/

const status =
    document.getElementById("status");


const categoriesContainer =
    document.getElementById("categories");


/*
==================================================
LOAD CATEGORIES
==================================================
*/

async function loadCategories() {

    status.innerText =
        "⏳ Đang lấy dữ liệu từ Supabase...";


    const {
        data,
        error
    } = await supabase

        .from("categories")

        .select("*")

        .order("id");


    /*
    ERROR
    */

    if (error) {

        console.error(error);


        status.className =
            "status error";


        status.innerHTML = `
            ❌ Kết nối thất bại.
            <br><br>
            <small>
                ${error.message}
            </small>
        `;

        return;
    }


    /*
    SUCCESS
    */

    status.className =
        "status success";


    status.innerHTML = `
        ✅ Kết nối Supabase thành công!
        <br>
        Đã lấy ${data.length} category.
    `;


    /*
    RENDER
    */

    categoriesContainer.innerHTML =
        data.map(category => `

            <div class="category">

                <strong>
                    ${category.name}
                </strong>

                <small>
                    /${category.slug}
                </small>

            </div>

        `).join("");

}


/*
==================================================
START
==================================================
*/

loadCategories();

</script>

</body>
</html>
