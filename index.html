<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mặc Gì Đây?</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f7f5f1;color:#181818;font-family:Arial,sans-serif}header{height:70px;border-bottom:1px solid #e5e0d8;display:flex;align-items:center;justify-content:space-between;padding:0 max(25px,8vw);background:#f7f5f1;position:sticky;top:0;z-index:10}.logo{font:bold 28px Georgia,serif}.nav{display:flex;gap:28px}.nav a{color:#555;text-decoration:none}.hero{max-width:1100px;margin:0 auto;padding:70px 20px;display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}.hero h1{font:700 78px/0.9 Georgia,serif;margin:10px 0 30px}.hero p{color:#777;font-size:17px;line-height:1.7}.hero-img{height:430px;background:#ded7c9;border-radius:30px;display:flex;align-items:end;padding:25px;overflow:hidden}.hero-img img{width:100%;height:100%;object-fit:cover;border-radius:20px}.hero-label{background:#fff;border-radius:30px;padding:12px 18px;position:absolute}.container{max-width:1100px;margin:auto;padding:30px 20px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.section-title{font:700 38px Georgia,serif}.outfit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:25px}.outfit-card{background:#fff;border:1px solid #e2ddd5;border-radius:20px;overflow:hidden}.outfit-image{height:420px;background:#e2dcd0}.outfit-image img{width:100%;height:100%;object-fit:cover}.outfit-info{padding:20px}.outfit-info h3{font:24px Georgia,serif;margin:0 0 8px}.outfit-info p{color:#777}.outfit-btn{width:100%;padding:13px;border:1px solid #ddd;background:white;border-radius:10px}.search{width:100%;padding:17px;border:1px solid #ddd6ca;border-radius:12px;background:#fff;font-size:16px;margin-bottom:15px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px}.filter{padding:10px 17px;border:1px solid #ddd6ca;background:#fff;border-radius:30px;cursor:pointer}.filter.active{background:#181818;color:#fff}.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.product-card{background:#fff;border:1px solid #e4dfd7;border-radius:14px;overflow:visible;position:relative}.product-image{height:280px;background:#eee;border-radius:14px 14px 0 0;overflow:hidden}.product-image img{width:100%;height:100%;object-fit:cover;transition:.25s}.product-card:hover .product-image img{transform:scale(1.04)}.product-info{padding:14px}.product-info h3{font-size:15px;margin:0 0 7px}.price{font-weight:bold}.product-link{display:block;margin-top:12px;background:#181818;color:white;text-align:center;padding:10px;border-radius:8px;text-decoration:none}.outfit-modal{position:fixed;inset:0;background:#0008;z-index:100;display:none;align-items:center;justify-content:center;padding:20px}.outfit-modal.show{display:flex}.modal-box{background:#fff;border-radius:20px;max-width:900px;width:100%;max-height:90vh;overflow:auto;padding:25px}.modal-head{display:flex;justify-content:space-between}.close{width:38px;height:38px;border:0;border-radius:50%;font-size:22px}.modal-products{display:grid;gap:8px;margin-top:20px}.modal-product{display:flex;align-items:center;gap:15px;padding:10px;border:1px solid #e2ddd5;border-radius:10px;text-decoration:none;color:#181818}.modal-product img{width:70px;height:80px;object-fit:cover;border-radius:8px}.empty{text-align:center;padding:60px;color:#999}@media(max-width:800px){.hero{grid-template-columns:1fr}.hero h1{font-size:60px}.outfit-grid{grid-template-columns:1fr 1fr}.product-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){header{padding:0 15px}.nav{display:none}.hero{padding:40px 15px}.hero h1{font-size:52px}.hero-img{height:320px}.container{padding:25px 15px}.outfit-grid,.product-grid{grid-template-columns:1fr}.product-image{height:360px}}</style></head><body><header><div class="logo">Mặc Gì Đây?</div><nav class="nav"><a href="#outfits">Outfit</a><a href="#products">Sản phẩm</a></nav></header><section class="hero"><div><small>FASHION · OUTFIT · SHOPPING</small><h1>Mặc gì<br>đây?</h1><p>Phối đồ dễ mặc, dễ đẹp. Tìm những món đồ xuất hiện trong các outfit và xem sản phẩm nhanh hơn.</p></div><div class="hero-img"><img id="heroImage" src="" style="display:none"><span class="hero-label">Outfit mới nhất</span></div></section><section id="outfits" class="container"><div class="section-head"><div class="section-title">Outfit mới nhất</div><span id="outfitCount"></span></div><div id="outfitGrid" class="outfit-grid"></div></section><section id="products" class="container"><div class="section-head"><div class="section-title">Sản phẩm</div><span id="productCount"></span></div><input id="search" class="search" placeholder="🔎  Tìm sản phẩm..."><div id="filters" class="filters"></div><div id="productGrid" class="product-grid"></div></section><div id="modal" class="outfit-modal"><div class="modal-box"><div class="modal-head"><div><h2 id="modalTitle"></h2><p id="modalDescription"></p></div><button class="close" onclick="closeModal()">×</button></div><div id="modalProducts" class="modal-products"></div></div></div><script>const SUPABASE_URL="https://rxeqynitxruylvcybrca.supabase.co";const SUPABASE_KEY="sb_publishable_DCZRB5bpOCQUGwEWWevizg_lAp2YvIm";const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let products=[],categories=[],outfits=[],activeCategory="all";const $=id=>document.getElementById(id);function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}async function load(){const[c,p,o]=await Promise.all([db.from("categories").select("*").order("name"),db.from("products").select("*,categories(name,slug)").eq("is_active",true).order("created_at",{ascending:false}),db.from("outfits").select("*,outfit_products(product_id,sort_order,products(id,name,image_url,price,affiliate_url,category_id))").eq("is_active",true).order("created_at",{ascending:false})]);categories=c.data||[];products=p.data||[];outfits=o.data||[];render()}function render(){renderHero();renderFilters();renderProducts();renderOutfits()}function renderHero(){const o=outfits[0];const img=o?.image_url||o?.outfit_products?.[0]?.products?.image_url;if(img){$("heroImage").src=img;$("heroImage").style.display="block"}}function renderFilters(){ $("filters").innerHTML=`<button class="filter ${activeCategory==="all"?"active":""}" onclick="setCategory('all')">Tất cả</button>`+categories.map(c=>`<button class="filter ${String(activeCategory)===String(c.id)?"active":""}" onclick="setCategory(${c.id})">${esc(c.name)}</button>`).join("")}function setCategory(id){activeCategory=id;renderFilters();renderProducts()}function renderProducts(){const q=$("search").value.toLowerCase();let list=products.filter(p=>(activeCategory==="all"||p.category_id===activeCategory)&&((p.name||"").toLowerCase().includes(q)||(p.description||"").toLowerCase().includes(q)));$("productCount").textContent=list.length+" sản phẩm";$("productGrid").innerHTML=list.length?list.map(p=>`<article class="product-card"><div class="product-image"><img src="${esc(p.image_url||"")}" loading="lazy"></div><div class="product-info"><h3>${esc(p.name)}</h3><div class="price">${esc(p.price||"")}</div>${p.affiliate_url?`<a class="product-link" href="${esc(p.affiliate_url)}" target="_blank" rel="noopener">Xem sản phẩm →</a>`:""}</div></article>`).join(""):`<div class="empty" style="grid-column:1/-1">Không tìm thấy sản phẩm phù hợp.</div>`}function renderOutfits(){$("outfitCount").textContent=outfits.length+" outfit";$("outfitGrid").innerHTML=outfits.length?outfits.map(o=>{const img=o.image_url||o.outfit_products?.[0]?.products?.image_url||"";return `<article class="outfit-card"><div class="outfit-image"><img src="${esc(img)}"></div><div class="outfit-info"><h3>${esc(o.name)}</h3><p>${esc(o.description||"")}</p><button class="outfit-btn" onclick="openOutfit(${o.id})">Xem các món trong set →</button></div></article>`}).join(""):`<div class="empty" style="grid-column:1/-1">Chưa có outfit nào.</div>`}function openOutfit(id){const o=outfits.find(x=>x.id===id);if(!o)return;$("modalTitle").textContent=o.name;$("modalDescription").textContent=o.description||"";$("modalProducts").innerHTML=(o.outfit_products||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).map(x=>{const p=x.products;return `<a class="modal-product" href="${esc(p.affiliate_url||"#")}" target="_blank" rel="noopener"><img src="${esc(p.image_url||"")}"><div><b>${esc(p.name)}</b><div>${esc(p.price||"")}</div></div></a>`}).join("");$("modal").classList.add("show")}function closeModal(){$("modal").classList.remove("show")}$("search").oninput=renderProducts;$("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};load();</script></body></html>
