<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mặc Gì Đây? — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Inter,Arial,sans-serif;
    background:#f7f5f0;
    color:#171717;
}
button,input,textarea,select{font:inherit}

.topbar{
    height:70px;
    background:#fff;
    border-bottom:1px solid #ddd8cf;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 32px;
    position:sticky;
    top:0;
    z-index:20;
}
.logo{
    font-family:Georgia,serif;
    font-size:25px;
    font-weight:bold;
}
.top-right{
    display:flex;
    gap:12px;
    align-items:center;
}
.user-email{
    font-size:13px;
    color:#777;
}
.btn{
    border:1px solid #d8d2c8;
    background:#fff;
    border-radius:10px;
    padding:10px 16px;
    cursor:pointer;
}
.btn:hover{background:#f1eee8}
.btn-dark{
    background:#171717;
    color:#fff;
    border-color:#171717;
}
.btn-danger{
    color:#b42318;
}
.container{
    max-width:1250px;
    margin:auto;
    padding:35px 24px 80px;
}

.login{
    max-width:420px;
    margin:100px auto;
    background:#fff;
    padding:35px;
    border:1px solid #ddd8cf;
    border-radius:18px;
}
.login h1{
    font-family:Georgia,serif;
    font-size:32px;
    margin-top:0;
}
.field{
    margin-bottom:16px;
}
.field label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:7px;
}
.field input,
.field textarea,
.field select{
    width:100%;
    padding:12px 13px;
    border:1px solid #d8d2c8;
    border-radius:10px;
    outline:none;
    background:#fff;
}
.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:#111;
}
textarea{
    min-height:100px;
    resize:vertical;
}

.error{
    color:#b42318;
    background:#fef3f2;
    border:1px solid #fecdca;
    padding:11px;
    border-radius:9px;
    margin-bottom:15px;
    display:none;
}
.success{
    color:#067647;
    background:#ecfdf3;
    border:1px solid #abefc6;
    padding:11px;
    border-radius:9px;
    margin-bottom:15px;
    display:none;
}

.dashboard{display:none}

.hero{
    display:flex;
    justify-content:space-between;
    align-items:end;
    margin-bottom:30px;
}
.hero h1{
    font-family:Georgia,serif;
    font-size:42px;
    margin:0 0 7px;
}
.hero p{
    margin:0;
    color:#777;
}

.tabs{
    display:flex;
    gap:8px;
    border-bottom:1px solid #ddd8cf;
    margin-bottom:28px;
}
.tab{
    padding:12px 18px;
    border:none;
    background:none;
    cursor:pointer;
    color:#777;
    border-bottom:2px solid transparent;
}
.tab.active{
    color:#111;
    border-bottom-color:#111;
}

.panel{display:none}
.panel.active{display:block}

.card{
    background:#fff;
    border:1px solid #ddd8cf;
    border-radius:16px;
    padding:22px;
    margin-bottom:20px;
}
.card-title{
    font-family:Georgia,serif;
    font-size:24px;
    margin:0 0 20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.table-wrap{
    overflow:auto;
}
table{
    width:100%;
    border-collapse:collapse;
}
th,td{
    text-align:left;
    padding:13px 10px;
    border-bottom:1px solid #eee9e0;
    font-size:14px;
}
th{
    font-size:12px;
    color:#777;
    text-transform:uppercase;
}
.product-thumb{
    width:58px;
    height:58px;
    border-radius:8px;
    object-fit:cover;
    background:#eee9e0;
}
.actions{
    display:flex;
    gap:7px;
}
.empty{
    text-align:center;
    padding:45px;
    color:#999;
}

.badge{
    display:inline-block;
    background:#f0ede7;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:20px;
}
.modal.show{display:flex}
.modal-box{
    background:#fff;
    width:min(650px,100%);
    max-height:90vh;
    overflow:auto;
    border-radius:18px;
    padding:28px;
}
.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}
.modal-header h2{
    font-family:Georgia,serif;
    margin:0;
}
.close{
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid #ddd;
    background:white;
    cursor:pointer;
}
.modal-footer{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
}

.preview{
    display:none;
    margin-top:12px;
    border-radius:10px;
    overflow:hidden;
    background:#eee9e0;
    width:130px;
    height:130px;
}
.preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

@media(max-width:700px){
    .topbar{padding:0 15px}
    .container{padding:25px 15px}
    .grid{grid-template-columns:1fr}
    .hero{display:block}
    .hero .btn{margin-top:15px}
    .user-email{display:none}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="login">
    <h1>Mặc Gì Đây?</h1>
    <p style="color:#777">Admin Dashboard</p>

    <div id="loginError" class="error"></div>

    <div class="field">
        <label>Email</label>
        <input id="email" type="email" placeholder="Email">
    </div>

    <div class="field">
        <label>Mật khẩu</label>
        <input id="password" type="password" placeholder="Mật khẩu">
    </div>

    <button id="loginBtn" class="btn btn-dark" style="width:100%">
        Đăng nhập
    </button>
</div>


<!-- DASHBOARD -->
<div id="dashboard" class="dashboard">

<header class="topbar">
    <div class="logo">Mặc Gì Đây?</div>

    <div class="top-right">
        <span id="userEmail" class="user-email"></span>
        <button id="logoutBtn" class="btn">Đăng xuất</button>
    </div>
</header>

<main class="container">

    <div class="hero">
        <div>
            <h1>Dashboard</h1>
            <p>Quản lý sản phẩm, danh mục và outfit.</p>
        </div>
    </div>

    <div id="globalError" class="error"></div>
    <div id="globalSuccess" class="success"></div>

    <div class="tabs">
        <button class="tab active" data-tab="productsPanel">
            Sản phẩm
        </button>

        <button class="tab" data-tab="categoriesPanel">
            Danh mục
        </button>

        <button class="tab" data-tab="outfitsPanel">
            Outfit
        </button>
    </div>


    <!-- PRODUCTS -->
    <section id="productsPanel" class="panel active">

        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center">
                <h2 class="card-title">Sản phẩm</h2>

                <button class="btn btn-dark" onclick="openProductModal()">
                    + Thêm sản phẩm
                </button>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Ảnh</th>
                        <th>Tên</th>
                        <th>Giá</th>
                        <th>Danh mục</th>
                        <th>Link</th>
                        <th></th>
                    </tr>
                    </thead>

                    <tbody id="productsTable"></tbody>
                </table>
            </div>
        </div>

    </section>


    <!-- CATEGORIES -->
    <section id="categoriesPanel" class="panel">

        <div class="card">

            <div style="display:flex;justify-content:space-between;align-items:center">
                <h2 class="card-title">Danh mục</h2>

                <button class="btn btn-dark" onclick="openCategoryModal()">
                    + Thêm danh mục
                </button>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Tên</th>
                        <th>Slug</th>
                        <th></th>
                    </tr>
                    </thead>

                    <tbody id="categoriesTable"></tbody>
                </table>
            </div>

        </div>

    </section>


    <!-- OUTFITS -->
    <section id="outfitsPanel" class="panel">

        <div class="card">

            <div style="display:flex;justify-content:space-between;align-items:center">
                <h2 class="card-title">Outfit</h2>

                <button class="btn btn-dark" onclick="openOutfitModal()">
                    + Thêm outfit
                </button>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Ảnh</th>
                        <th>Tên</th>
                        <th>Mô tả</th>
                        <th></th>
                    </tr>
                    </thead>

                    <tbody id="outfitsTable"></tbody>
                </table>
            </div>

        </div>

    </section>

</main>
</div>


<!-- PRODUCT MODAL -->
<div id="productModal" class="modal">
<div class="modal-box">

<div class="modal-header">
    <h2 id="productModalTitle">Thêm sản phẩm</h2>
    <button class="close" onclick="closeModal('productModal')">×</button>
</div>

<div id="productError" class="error"></div>

<input id="productId" type="hidden">

<div class="field">
    <label>Tên sản phẩm</label>
    <input id="productName" placeholder="Ví dụ: Áo trễ vai chấm bi">
</div>

<div class="grid">

<div class="field">
    <label>Giá</label>
    <input id="productPrice" type="number" placeholder="199000">
</div>

<div class="field">
    <label>Danh mục</label>
    <select id="productCategory"></select>
</div>

</div>

<div class="field">
    <label>Link TikTok Affiliate</label>
    <input id="productAffiliate"
           placeholder="https://vt.tiktok.com/...">
</div>

<div class="field">
    <label>Thumbnail URL</label>
    <input id="productThumbnail"
           placeholder="https://...">
</div>

<div id="productPreview" class="preview">
    <img id="productPreviewImg">
</div>

<div class="field">
    <label>Mô tả</label>
    <textarea id="productDescription"
              placeholder="Mô tả sản phẩm..."></textarea>
</div>

<div class="modal-footer">
    <button class="btn" onclick="closeModal('productModal')">
        Hủy
    </button>

    <button class="btn btn-dark" onclick="saveProduct()">
        Lưu sản phẩm
    </button>
</div>

</div>
</div>


<!-- CATEGORY MODAL -->
<div id="categoryModal" class="modal">
<div class="modal-box">

<div class="modal-header">
    <h2>Thêm danh mục</h2>
    <button class="close" onclick="closeModal('categoryModal')">×</button>
</div>

<div id="categoryError" class="error"></div>

<input id="categoryId" type="hidden">

<div class="field">
    <label>Tên danh mục</label>
    <input id="categoryName" placeholder="Ví dụ: Áo">
</div>

<div class="field">
    <label>Slug</label>
    <input id="categorySlug" placeholder="ao">
</div>

<div class="modal-footer">
    <button class="btn" onclick="closeModal('categoryModal')">
        Hủy
    </button>

    <button class="btn btn-dark" onclick="saveCategory()">
        Lưu danh mục
    </button>
</div>

</div>
</div>


<!-- OUTFIT MODAL -->
<div id="outfitModal" class="modal">
<div class="modal-box">

<div class="modal-header">
    <h2>Thêm outfit</h2>
    <button class="close" onclick="closeModal('outfitModal')">×</button>
</div>

<div id="outfitError" class="error"></div>

<input id="outfitId" type="hidden">

<div class="field">
    <label>Tên outfit</label>
    <input id="outfitName"
           placeholder="Ví dụ: Set đi chơi cuối tuần">
</div>

<div class="field">
    <label>Ảnh outfit</label>
    <input id="outfitImage"
           placeholder="https://...">
</div>

<div class="field">
    <label>Mô tả</label>
    <textarea id="outfitDescription"
              placeholder="Áo + quần + giày + túi..."></textarea>
</div>

<div class="modal-footer">
    <button class="btn" onclick="closeModal('outfitModal')">
        Hủy
    </button>

    <button class="btn btn-dark" onclick="saveOutfit()">
        Lưu outfit
    </button>
</div>

</div>
</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://rxeqynitxruylvcybrca.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DCZRB5bpOCQUGwEWWevizg_lAp2YvIm";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let categories = [];
let products = [];
let outfits = [];


/* =========================================================
   HELPERS
========================================================= */

function showError(id,message){
    const el=document.getElementById(id);
    el.textContent=message;
    el.style.display="block";
}

function hideError(id){
    const el=document.getElementById(id);
    el.style.display="none";
}

function showSuccess(message){
    const el=document.getElementById("globalSuccess");
    el.textContent=message;
    el.style.display="block";

    setTimeout(()=>{
        el.style.display="none";
    },3000);
}

function escapeHtml(value){
    if(value===null || value===undefined) return "";
    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function formatPrice(price){
    if(price===null || price===undefined || price==="")
        return "—";

    return Number(price).toLocaleString("vi-VN")+"đ";
}

function closeModal(id){
    document.getElementById(id).classList.remove("show");
}


/* =========================================================
   LOGIN
========================================================= */

document.getElementById("loginBtn").addEventListener("click",login);

document.getElementById("password").addEventListener("keydown",e=>{
    if(e.key==="Enter") login();
});

async function login(){

    hideError("loginError");

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if(!email || !password){
        showError("loginError","Vui lòng nhập email và mật khẩu.");
        return;
    }

    const btn=document.getElementById("loginBtn");

    btn.disabled=true;
    btn.textContent="Đang đăng nhập...";

    const {data,error} =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

    btn.disabled=false;
    btn.textContent="Đăng nhập";

    if(error){
        showError("loginError",error.message);
        return;
    }

    currentUser=data.user;

    await checkAdmin();

}


/* =========================================================
   CHECK ADMIN
========================================================= */

async function checkAdmin(){

    if(!currentUser){
        showLogin();
        return;
    }

    const {data,error} =
        await supabaseClient
        .from("admin_users")
        .select("user_id")
        .eq("user_id",currentUser.id)
        .maybeSingle();

    if(error){
        showError(
            "loginError",
            "Không thể kiểm tra quyền Admin: "+error.message
        );

        await supabaseClient.auth.signOut();
        return;
    }

    if(!data){
        showError(
            "loginError",
            "Tài khoản này chưa được cấp quyền Admin."
        );

        await supabaseClient.auth.signOut();
        return;
    }

    showDashboard();

}


/* =========================================================
   SESSION
========================================================= */

async function checkSession(){

    const {data} =
        await supabaseClient.auth.getSession();

    if(data.session){
        currentUser=data.session.user;
        await checkAdmin();
    }
}

function showDashboard(){

    document.getElementById("loginScreen").style.display="none";
    document.getElementById("dashboard").style.display="block";

    document.getElementById("userEmail").textContent =
        currentUser.email || "";

    loadAll();
}

function showLogin(){

    document.getElementById("loginScreen").style.display="block";
    document.getElementById("dashboard").style.display="none";
}

document.getElementById("logoutBtn").addEventListener("click",async()=>{

    await supabaseClient.auth.signOut();

    currentUser=null;

    showLogin();

});


/* =========================================================
   TABS
========================================================= */

document.querySelectorAll(".tab").forEach(tab=>{

    tab.addEventListener("click",()=>{

        document.querySelectorAll(".tab")
            .forEach(x=>x.classList.remove("active"));

        document.querySelectorAll(".panel")
            .forEach(x=>x.classList.remove("active"));

        tab.classList.add("active");

        document
            .getElementById(tab.dataset.tab)
            .classList.add("active");

    });

});


/* =========================================================
   LOAD ALL
========================================================= */

async function loadAll(){

    await Promise.all([
        loadCategories(),
        loadProducts(),
        loadOutfits()
    ]);

}


/* =========================================================
   CATEGORIES
========================================================= */

async function loadCategories(){

    const {data,error} =
        await supabaseClient
        .from("categories")
        .select("*")
        .order("name");

    if(error){
        showGlobalError(error.message);
        return;
    }

    categories=data || [];

    renderCategories();
    fillCategorySelect();

}


function renderCategories(){

    const tbody =
        document.getElementById("categoriesTable");

    if(!categories.length){

        tbody.innerHTML=`
        <tr>
            <td colspan="3" class="empty">
                Chưa có danh mục.
            </td>
        </tr>`;

        return;
    }

    tbody.innerHTML=categories.map(c=>`

        <tr>

            <td>
                <strong>${escapeHtml(c.name)}</strong>
            </td>

            <td>
                <span class="badge">
                    ${escapeHtml(c.slug || "")}
                </span>
            </td>

            <td>
                <div class="actions">

                    <button
                        class="btn btn-danger"
                        onclick="deleteCategory('${c.id}')">
                        Xóa
                    </button>

                </div>
            </td>

        </tr>

    `).join("");

}


function fillCategorySelect(){

    const select =
        document.getElementById("productCategory");

    select.innerHTML=`
        <option value="">-- Chọn danh mục --</option>
    `;

    categories.forEach(c=>{

        select.innerHTML+=`
            <option value="${escapeHtml(c.id)}">
                ${escapeHtml(c.name)}
            </option>
        `;

    });

}


function openCategoryModal(){

    document.getElementById("categoryId").value="";
    document.getElementById("categoryName").value="";
    document.getElementById("categorySlug").value="";

    hideError("categoryError");

    document
        .getElementById("categoryModal")
        .classList.add("show");
}


document.getElementById("categoryName")
.addEventListener("input",e=>{

    const slug=e.target.value
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/đ/g,"d")
        .replace(/[^a-z0-9]+/g,"-")
        .replace(/^-|-$/g,"");

    document.getElementById("categorySlug").value=slug;

});


async function saveCategory(){

    hideError("categoryError");

    const name =
        document.getElementById("categoryName")
        .value.trim();

    const slug =
        document.getElementById("categorySlug")
        .value.trim();

    if(!name || !slug){

        showError(
            "categoryError",
            "Vui lòng nhập tên danh mục."
        );

        return;
    }

    const {error} =
        await supabaseClient
        .from("categories")
        .insert({
            name,
            slug
        });

    if(error){

        showError(
            "categoryError",
            error.message
        );

        return;
    }

    closeModal("categoryModal");

    showSuccess("Đã thêm danh mục.");

    await loadCategories();

}


async function deleteCategory(id){

    if(!confirm("Xóa danh mục này?")) return;

    const {error} =
        await supabaseClient
        .from("categories")
        .delete()
        .eq("id",id);

    if(error){
        showGlobalError(error.message);
        return;
    }

    showSuccess("Đã xóa danh mục.");

    await loadCategories();

}


/* =========================================================
   PRODUCTS
========================================================= */

async function loadProducts(){

    const {data,error} =
        await supabaseClient
        .from("products")
        .select("*")
        .order("created_at",{ascending:false});

    if(error){

        showGlobalError(error.message);

        return;
    }

    products=data || [];

    renderProducts();

}


function getCategoryName(id){

    const category =
        categories.find(c=>c.id===id);

    return category
        ? category.name
        : "—";

}


function renderProducts(){

    const tbody =
        document.getElementById("productsTable");

    if(!products.length){

        tbody.innerHTML=`
        <tr>
            <td colspan="6" class="empty">
                Chưa có sản phẩm.
            </td>
        </tr>`;

        return;
    }

    tbody.innerHTML=products.map(p=>`

        <tr>

            <td>
                ${
                    p.thumbnail_url
                    ?
                    `<img
                        class="product-thumb"
                        src="${escapeHtml(p.thumbnail_url)}"
                        onerror="this.style.display='none'"
                    >`
                    :
                    `<div class="product-thumb"></div>`
                }
            </td>

            <td>
                <strong>
                    ${escapeHtml(p.name || "Không tên")}
                </strong>
            </td>

            <td>
                ${formatPrice(p.price)}
            </td>

            <td>
                <span class="badge">
                    ${escapeHtml(
                        getCategoryName(p.category_id)
                    )}
                </span>
            </td>

            <td>
                ${
                    p.affiliate_url
                    ?
                    `<a
                        href="${escapeHtml(p.affiliate_url)}"
                        target="_blank">
                        Mở link
                    </a>`
                    :
                    "—"
                }
            </td>

            <td>
                <button
                    class="btn btn-danger"
                    onclick="deleteProduct('${p.id}')">
                    Xóa
                </button>
            </td>

        </tr>

    `).join("");

}


function openProductModal(){

    document.getElementById("productId").value="";
    document.getElementById("productName").value="";
    document.getElementById("productPrice").value="";
    document.getElementById("productCategory").value="";
    document.getElementById("productAffiliate").value="";
    document.getElementById("productThumbnail").value="";
    document.getElementById("productDescription").value="";

    document.getElementById("productModalTitle")
        .textContent="Thêm sản phẩm";

    document.getElementById("productPreview")
        .style.display="none";

    hideError("productError");

    document
        .getElementById("productModal")
        .classList.add("show");

}


document.getElementById("productThumbnail")
.addEventListener("input",()=>{

    const url =
        document.getElementById("productThumbnail")
        .value.trim();

    const preview =
        document.getElementById("productPreview");

    const img =
        document.getElementById("productPreviewImg");

    if(url){

        img.src=url;
        preview.style.display="block";

    }else{

        preview.style.display="none";

    }

});


async function saveProduct(){

    hideError("productError");

    const name =
        document.getElementById("productName")
        .value.trim();

    const price =
        document.getElementById("productPrice")
        .value;

    const category_id =
        document.getElementById("productCategory")
        .value || null;

    const affiliate_url =
        document.getElementById("productAffiliate")
        .value.trim();

    const thumbnail_url =
        document.getElementById("productThumbnail")
        .value.trim();

    const description =
        document.getElementById("productDescription")
        .value.trim();

    if(!name){

        showError(
            "productError",
            "Vui lòng nhập tên sản phẩm."
        );

        return;
    }

    if(!affiliate_url){

        showError(
            "productError",
            "Vui lòng nhập link TikTok Affiliate."
        );

        return;
    }

    const product={
        name,
        price: price ? Number(price) : null,
        category_id,
        affiliate_url,
        thumbnail_url: thumbnail_url || null,
        description: description || null
    };

    const {error} =
        await supabaseClient
        .from("products")
        .insert(product);

    if(error){

        showError(
            "productError",
            error.message
        );

        return;
    }

    closeModal("productModal");

    showSuccess("Đã thêm sản phẩm.");

    await loadProducts();

}


async function deleteProduct(id){

    if(!confirm("Xóa sản phẩm này?")) return;

    const {error} =
        await supabaseClient
        .from("products")
        .delete()
        .eq("id",id);

    if(error){

        showGlobalError(error.message);

        return;
    }

    showSuccess("Đã xóa sản phẩm.");

    await loadProducts();

}


/* =========================================================
   OUTFITS
========================================================= */

async function loadOutfits(){

    const {data,error} =
        await supabaseClient
        .from("outfits")
        .select("*")
        .order("created_at",{ascending:false});

    if(error){

        showGlobalError(error.message);

        return;
    }

    outfits=data || [];

    renderOutfits();

}


function renderOutfits(){

    const tbody =
        document.getElementById("outfitsTable");

    if(!outfits.length){

        tbody.innerHTML=`
        <tr>
            <td colspan="4" class="empty">
                Chưa có outfit.
            </td>
        </tr>`;

        return;
    }

    tbody.innerHTML=outfits.map(o=>`

        <tr>

            <td>
                ${
                    o.image_url
                    ?
                    `<img
                        class="product-thumb"
                        src="${escapeHtml(o.image_url)}"
                    >`
                    :
                    `<div class="product-thumb"></div>`
                }
            </td>

            <td>
                <strong>
                    ${escapeHtml(o.name || "")}
                </strong>
            </td>

            <td>
                ${escapeHtml(o.description || "—")}
            </td>

            <td>
                <button
                    class="btn btn-danger"
                    onclick="deleteOutfit('${o.id}')">
                    Xóa
                </button>
            </td>

        </tr>

    `).join("");

}


function openOutfitModal(){

    document.getElementById("outfitId").value="";
    document.getElementById("outfitName").value="";
    document.getElementById("outfitImage").value="";
    document.getElementById("outfitDescription").value="";

        });

    closeModal("outfitModal");

async function deleteOutfit(id){

    if(!confirm("Xóa outfit này?")) return;

    const {error} =
        await supabaseClient
        .from("outfits")
        .delete()

    if(error){

/* =========================================================
   GLOBAL ERROR
========================================================= */

function showGlobalError(message){

    const el =
        document.getElementById("globalError");

    el.textContent=message;
    el.style.display="block";

}

checkSession();
