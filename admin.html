<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mặc Gì Đây? - Admin</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#f7f5f0;
    color:#171717;
    font-family:Arial,sans-serif;
}

.wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:420px;
    background:white;
    border:1px solid #ddd8cf;
    border-radius:20px;
    padding:35px;
    box-shadow:0 15px 50px rgba(0,0,0,.06);
}

h1{
    margin:0 0 8px;
    font-family:Georgia,serif;
    font-size:36px;
}

p{
    color:#777;
    margin:0 0 30px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d8d2c8;
    border-radius:10px;
    margin-bottom:18px;
    outline:none;
}

button{
    width:100%;
    border:0;
    background:#171717;
    color:white;
    padding:14px;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
}

.status{
    margin-top:20px;
    padding:12px;
    border-radius:10px;
    background:#f0ede7;
    font-size:13px;
}

</style>
</head>

<body>

<div class="wrap">

    <div class="box">

        <h1>Mặc Gì Đây?</h1>

        <p>Admin Dashboard</p>

        <label>Email</label>

        <input
            id="email"
            type="email"
            placeholder="Email của bạn"
        >

        <label>Mật khẩu</label>

        <input
            id="password"
            type="password"
            placeholder="Mật khẩu"
        >

        <button onclick="test()">
            Đăng nhập
        </button>

        <div id="status" class="status">
            ✅ Admin HTML đang hoạt động.
        </div>

    </div>

</div>

<script>

function test(){

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    if(!email || !password){

        document.getElementById("status").textContent =
            "⚠️ Hãy nhập email và mật khẩu.";

        return;
    }

    document.getElementById("status").textContent =
        "✅ HTML + JavaScript hoạt động bình thường.";

}

</script>

</body>
</html>
